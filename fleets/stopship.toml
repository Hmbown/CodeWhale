# Fleet roster: stopship
#
# Named stopship fleet binding roles → AgentProfile ids. Fleet resolves roles
# only — it does NOT spawn tmux or manage worktrees (Runtime owns those).
#
# Load path (when wired by workflow run --fleet):
#   1. $CODEWHALE_HOME/fleets/stopship.toml
#   2. <workspace>/fleets/stopship.toml  (this file)
#
# Profile ids name built-in roster members (scout, builder, reviewer,
# verifier, manager); role names use the canonical Codewhale role
# vocabulary (explore, implement, reviewer, test, custom names).

name = "stopship"
description = "Read-only current release orchestration acceptance fleet"

[roles]
# role name = AgentProfile id (built-in or workspace profile)
explore = "scout"
implement = "builder"
reviewer = "reviewer"
test = "verifier"
release_lead = "manager"

[role_intents.explore]
mode = "read_only"
summary = "Source-level runtime and receipt reconnaissance"

[role_intents.implement]
mode = "read_only"
summary = "No-edit acceptance evidence plan"

[role_intents.reviewer]
mode = "read_only"
summary = "False-green and receipt-contract review"

[role_intents.test]
mode = "read_only"
summary = "Static test and receipt serialization verification"

[role_intents.release_lead]
mode = "read_only"
summary = "Final evidence-only acceptance receipt"
